[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "evalos"
version = "0.1.0"
description = "LLM Evaluation & Benchmarking Framework"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "black", "ruff"]